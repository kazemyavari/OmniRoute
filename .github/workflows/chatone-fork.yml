name: ChatOne fork contracts and Docker build
on:
  push:
    branches: ["feat/chatone-maintained", "chatone/**"]
  pull_request:
    branches: ["feat/chatone-maintained", "chatone/**"]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: chatone-fork-${{ github.ref }}
  cancel-in-progress: true
jobs:
  contracts:
    if: github.repository == 'kazemyavari/OmniRoute'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          fetch-depth: 0
          filter: blob:none
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: "26"
          cache: npm
      - run: npm ci --no-audit --no-fund
      - run: npm run check:chatone
      - run: npm run test:chatone
      - run: npm run typecheck:core
      - run: npm run test:vitest
  docker:
    if: github.repository == 'kazemyavari/OmniRoute'
    needs: contracts
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - name: Build the committed source; never deploy or publish automatically
        run: >-
          docker build --target runner-base
          --build-arg OMNIROUTE_BUILD_MEMORY_MB=4096
          --build-arg OMNIROUTE_BUILD_WORKERS=2
          --label org.opencontainers.image.revision=${{ github.sha }}
          -t chatone/omniroute:${{ github.sha }} .
      - name: Check runtime dependencies without live data
        run: >-
          docker run --rm --entrypoint node chatone/omniroute:${{ github.sha }}
          -e "require('better-sqlite3'); console.log('runtime dependencies load')"
